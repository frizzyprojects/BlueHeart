<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>I love you &lt;3</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;}
  #wrap{display:flex;align-items:center;justify-content:center;width:100%;height:100%;}
  canvas{max-width:100vw;max-height:100vh;width:auto;height:auto;display:block;}
  #audioBar{position:fixed;bottom:12px;left:12px;color:#7d90b8;font:12px system-ui,sans-serif;
    opacity:.65;display:flex;gap:6px;align-items:center;}
  #audioBar input{cursor:pointer;}
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="2000" height="1200"></canvas></div>
<div id="audioBar">🎵 <input type="file" id="audioFile" accept="audio/*" title="Play your own music (optional)"></div>
<audio id="bgAudio" loop></audio>
<script>
(function(){
const WIDTH=2000, HEIGHT=1200, SCALE=20;
const WORDS=["love you","Love You","LOVE YOU"];
const CENTER_TEXT=" Love You ";
const COLORS=["rgb(70,130,180)","rgb(30,144,255)","rgb(0,191,255)","rgb(100,149,237)","rgb(65,105,225)"];

function heartXY(t){
  const x=16*Math.pow(Math.sin(t),3);
  const y=13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t);
  return [x,-y];
}
function toScreen(x,y){ return [x*SCALE+WIDTH/2, y*SCALE+HEIGHT/2]; }
function dist(ax,ay,bx,by){ return Math.hypot(ax-bx,ay-by); }

function makeParticle(x,y,order,kind){
  return {x,y,order,kind,
    word: WORDS[Math.floor(Math.random()*WORDS.length)],
    color: COLORS[Math.floor(Math.random()*COLORS.length)],
    alpha:0, flicker: Math.random()*Math.PI*2, delay:0,
    sizeMult: 0.85+Math.random()*0.3};
}

function buildOutline(n,minGap){
  const out=[], placed=[];
  for(let i=0;i<n;i++){
    const t=(i/n)*2*Math.PI;
    const [bx,by]=heartXY(t);
    const [sx,sy]=toScreen(bx,by);
    if(placed.some(p=>dist(sx,sy,p[0],p[1])<minGap)) continue;
    placed.push([sx,sy]);
    out.push(makeParticle(sx,sy,i,'outline'));
  }
  return out;
}
function buildFill(n,minGap){
  const out=[], placed=[];
  let attempts=0; const maxA=n*80;
  while(out.length<n && attempts<maxA){
    attempts++;
    const t=Math.random()*2*Math.PI, r=Math.random()*0.86;
    const [bx,by]=heartXY(t);
    const [sx,sy]=toScreen(bx*r,by*r);
    if(placed.some(p=>dist(sx,sy,p[0],p[1])<minGap)) continue;
    placed.push([sx,sy]);
    out.push(makeParticle(sx,sy,Math.floor(Math.random()*321),'fill'));
  }
  return out;
}

const outline=buildOutline(160,30);
const fill=buildFill(130,46);
const outlineSpan=outline.length?Math.max(...outline.map(p=>p.order)):0;
const framesPerStep=1.6;
const fillStartFrame=Math.floor(outlineSpan*framesPerStep)+30;
fill.forEach(p=>p.delay=fillStartFrame+p.order);
outline.forEach(p=>p.delay=Math.floor(p.order*framesPerStep));
const particles=outline.concat(fill);
particles.forEach(p=>p.fontSize=p.kind==='outline'?20:17);

const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');

function drawGlowText(word,color,x,y,alpha,sizeMult,fontSize,family){
  if(alpha<=0) return;
  ctx.save();
  ctx.globalAlpha=Math.min(1,alpha/255);
  ctx.font=`bold ${Math.round(fontSize*sizeMult)}px ${family}`;
  ctx.fillStyle=color;
  ctx.textAlign='center';
  ctx.textBaseline='middle';
  if(alpha>10){ ctx.shadowColor=color; ctx.shadowBlur=18; }
  ctx.fillText(word,x,y);
  ctx.restore();
}

let frame=0;
const centerStart=fillStartFrame+200;

function animate(){
  frame++;
  ctx.shadowBlur=0;
  ctx.globalAlpha=1;
  ctx.fillStyle='#000';
  ctx.fillRect(0,0,WIDTH,HEIGHT);

  for(const p of particles){
    if(frame>p.delay && p.alpha<255){
      p.alpha=Math.min(255,p.alpha+14+Math.floor(Math.random()*5));
    }
    const flick=p.alpha>=255 ? 0.75+0.25*Math.sin(frame*0.04+p.flicker) : 1.0;
    const alpha=Math.floor(p.alpha*flick);
    if(alpha<=0) continue;
    drawGlowText(p.word,p.color,p.x,p.y,alpha,p.sizeMult,p.fontSize,'Arial');
  }

  if(frame>centerStart){
    const progress=Math.min(1,(frame-centerStart)/60);
    const centerAlpha=255*(1-Math.exp(-progress*8));
    const pulse=1.0+0.025*Math.sin(frame*0.05);
    ctx.save();
    ctx.globalAlpha=Math.min(1,centerAlpha/255);
    ctx.font=`bold ${Math.round(54*pulse)}px Georgia, serif`;
    ctx.fillStyle='rgb(255,250,245)';
    ctx.textAlign='center';
    ctx.textBaseline='middle';
    if(centerAlpha>10){ ctx.shadowColor='rgb(255,250,245)'; ctx.shadowBlur=30; }
    ctx.fillText(CENTER_TEXT,WIDTH/2,HEIGHT/2);
    ctx.restore();
  }

  requestAnimationFrame(animate);
}
animate();

const audioFile=document.getElementById('audioFile');
const bgAudio=document.getElementById('bgAudio');
audioFile.addEventListener('change',e=>{
  const f=e.target.files[0];
  if(f){ bgAudio.src=URL.createObjectURL(f); bgAudio.play().catch(()=>{}); }
});
})();
</script>
</body>
</html>
